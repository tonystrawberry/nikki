name: Translate New Posts

on:
  push:
    branches:
      - main
    paths:
      - "posts/en/**/*.md"
  workflow_dispatch:
    inputs:
      post_path:
        description: "Path to the English post (e.g. posts/en/2026-03-11/hello-world.md). Leave empty to process all missing translations."
        required: false
        type: string

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find English posts missing translations
        id: find_posts
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.post_path }}" ]; then
              CANDIDATES="${{ inputs.post_path }}"
            else
              CANDIDATES=$(find posts/en -name "*.md" | sort)
            fi
          else
            CANDIDATES=$(git diff --name-only HEAD~1 HEAD -- 'posts/en/**/*.md' 2>/dev/null || git show --name-only --format='' HEAD -- 'posts/en/**/*.md')
          fi

          MISSING=""
          for FILE in $CANDIDATES; do
            RELATIVE="${FILE#posts/en/}"
            FR_PATH="posts/fr/$RELATIVE"
            JA_PATH="posts/ja/$RELATIVE"

            NEEDS_FR=false
            NEEDS_JA=false
            [ ! -f "$FR_PATH" ] && NEEDS_FR=true
            [ ! -f "$JA_PATH" ] && NEEDS_JA=true

            if $NEEDS_FR || $NEEDS_JA; then
              MISSING="$MISSING $FILE"
            fi
          done

          MISSING="${MISSING# }"
          echo "posts=$MISSING" >> "$GITHUB_OUTPUT"
          echo "Found posts needing translation: $MISSING"

      - name: Set up Node.js
        if: steps.find_posts.outputs.posts != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Anthropic SDK
        if: steps.find_posts.outputs.posts != ''
        run: npm install @anthropic-ai/sdk

      - name: Translate posts via Claude API
        if: steps.find_posts.outputs.posts != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POSTS: ${{ steps.find_posts.outputs.posts }}
        run: |
          node << 'EOF'
          const Anthropic = require("@anthropic-ai/sdk");
          const fs = require("fs");
          const path = require("path");

          const client = new Anthropic();
          const posts = process.env.POSTS.trim().split(/\s+/).filter(Boolean);

          async function translate(content, lang) {
            const langLabel = lang === "fr" ? "French" : "Japanese";
            const credit = lang === "fr" ? "*Traduit par Claude*" : "*Claudeによる翻訳*";

            const message = await client.messages.create({
              model: "claude-opus-4-6",
              max_tokens: 4096,
              messages: [
                {
                  role: "user",
                  content: `Translate the following markdown blog post into ${langLabel}.
          Rules:
          - Translate the frontmatter fields "title" and "excerpt" only. Keep all other frontmatter fields identical.
          - Translate the body content naturally and fluently.
          - If the post does not already end with a "---" separator and a credit line, append exactly this at the end:

          ---
          ${credit}

          Return only the translated markdown, no explanation.

          ${content}`,
                },
              ],
            });

            return message.content[0].text;
          }

          async function run() {
            for (const enPath of posts) {
              const relative = enPath.replace(/^posts\/en\//, "");
              const content = fs.readFileSync(enPath, "utf8");

              for (const lang of ["fr", "ja"]) {
                const outPath = `posts/${lang}/${relative}`;
                if (fs.existsSync(outPath)) {
                  console.log(`Skipping ${outPath} (already exists)`);
                  continue;
                }
                console.log(`Translating ${enPath} → ${outPath}`);
                const translated = await translate(content, lang);
                fs.mkdirSync(path.dirname(outPath), { recursive: true });
                fs.writeFileSync(outPath, translated);
                console.log(`Written: ${outPath}`);
              }
            }
          }

          run().catch((err) => { console.error(err); process.exit(1); });
          EOF

      - name: Open PR with translations
        if: steps.find_posts.outputs.posts != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="translate/$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add posts/fr/ posts/ja/
          git commit -m "chore: add fr and ja translations"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: translate new posts to fr and ja" \
            --body "Automatically translated by Claude $(echo '${{ steps.find_posts.outputs.posts }}' | tr ' ' '\n' | sed 's/^/- /')" \
            --base main \
            --head "$BRANCH"
