name: Translate New Posts

on:
  push:
    branches:
      - main
    paths:
      - "posts/en/**/*.md"
  workflow_dispatch:
    inputs:
      post_path:
        description: "Path to the English post (e.g. posts/en/2026-03-11/hello-world.md). Leave empty to process all missing translations."
        required: false
        type: string

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find English posts missing translations
        id: find_posts
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.post_path }}" ]; then
              # Single file specified manually
              CANDIDATES="${{ inputs.post_path }}"
            else
              # No file specified — scan all en posts
              CANDIDATES=$(find posts/en -name "*.md" | sort)
            fi
          else
            # Triggered by push — only look at changed files
            CANDIDATES=$(git diff --name-only HEAD~1 HEAD -- 'posts/en/**/*.md' 2>/dev/null || git show --name-only --format='' HEAD -- 'posts/en/**/*.md')
          fi

          MISSING=""
          for FILE in $CANDIDATES; do
            RELATIVE="${FILE#posts/en/}"
            FR_PATH="posts/fr/$RELATIVE"
            JA_PATH="posts/ja/$RELATIVE"

            NEEDS_FR=false
            NEEDS_JA=false
            [ ! -f "$FR_PATH" ] && NEEDS_FR=true
            [ ! -f "$JA_PATH" ] && NEEDS_JA=true

            if $NEEDS_FR || $NEEDS_JA; then
              MISSING="$MISSING $FILE"
            fi
          done

          MISSING="${MISSING# }"
          echo "posts=$MISSING" >> "$GITHUB_OUTPUT"
          echo "Found posts needing translation: $MISSING"

      - name: Translate posts with Claude Code
        if: steps.find_posts.outputs.posts != ''
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are a professional translator. Your task is to translate English blog posts into French and Japanese.

            For each file listed below, do the following:
            1. Read the English source file.
            2. Check if the French translation exists at `posts/fr/<date>/<filename>`. If it does NOT exist, create it.
            3. Check if the Japanese translation exists at `posts/ja/<date>/<filename>`. If it does NOT exist, create it.
            4. When creating a translation:
               - Translate the frontmatter fields: `title`, `excerpt`. Keep all other fields identical (date, author, category, tags, coverImage).
               - Translate the full body content naturally and fluently into the target language.
               - Add a final line at the bottom (after a `---` separator): `*Traduit par Claude*` for French, `*Claudeによる翻訳*` for Japanese.

            Files to process:
            ${{ steps.find_posts.outputs.posts }}

      - name: Commit translations
        if: steps.find_posts.outputs.posts != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/fr/ posts/ja/
          git diff --cached --quiet || git commit -m "chore: auto-translate new posts to fr and ja [skip ci]"
          git push
